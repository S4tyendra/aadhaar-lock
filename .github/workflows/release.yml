name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0

      - uses: gradle/actions/setup-gradle@v4

      # The COUI runtime lives in a private repo and never gets committed here
      - name: Download COUI Kit
        env:
          GH_TOKEN: ${{ secrets.COUI_PAT }}
        run: |
          mkdir -p libs
          gh api -H "Accept: application/vnd.github.raw" \
            repos/S4tyendra/coui-kit/contents/dist/coui-kit-1.0.0.aar > libs/coui-kit-1.0.0.aar
          test -s libs/coui-kit-1.0.0.aar

      - name: Build signed APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir dist
          dir=build/outputs/apk/release
          cp "$dir/aadhaar-lock-universal-release.apk" "dist/aadhaar-lock-$VERSION-universal.apk"
          cp "$dir/aadhaar-lock-armeabi-v7a-release.apk" "dist/aadhaar-lock-$VERSION-armeabi-v7a.apk"
          cp "$dir/aadhaar-lock-arm64-v8a-release.apk" "dist/aadhaar-lock-$VERSION-arm64-v8a.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/*.apk --title "v$VERSION" --generate-notes
